spring:
  application:
    name: consumer-lending-department-site
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/consumer-lending-site
    username: postgres
    password: admin
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

site:
  nbrb:
    base-url: https://api.nbrb.by
    connect-timeout: 10s
    read-timeout: 10s
    cron: "0 0 6 * * *"

logging:
  file:
    name: /consumer-lending-site/logs/consumer-lending-site.log
  level:
    by.belarusbank.deb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web.servlet.mvc.method.annotation.ServletInvocableHandlerMethod: DEBUG
    org.springframework.security: info
    org.springframework.web.client.RestClient: DEBUG
    com.fasterxml.jackson: TRACE

server:
  servlet:
    context-path: /consumer-lending-site/v1
  port: 8080


